id = "rockide-language-server"
name = "Rockide Language Server"
version = "0.2.0"
schema_version = 1
authors = ["rockide"]
description = "Zed extension for Minecraft Bedrock that provides rich auto-completions, go-to definitions, and schema validation."
repository = "https://github.com/rockide/rockide-zed"

[language_servers.rockide]
name = "rockide"
languages = ["JSON", "JSONC", "Minecraft Lang", "Minecraft Function"]

[language_servers.rockide.language_ids]
"JSON" = "json"
"JSONC" = "jsonc"

[grammars.lang]
repository = "https://github.com/rockide/tree-sitter-lang"
commit = "a32714513c10274f32d4ac10e523f3b54291ece7"

[grammars.mcfunction]
repository = "https://github.com/rockide/tree-sitter-mcfunction"
commit = "a6667734c8022fb93398e429260309fc104d9e9a"
